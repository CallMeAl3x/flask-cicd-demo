name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Trigger Coolify Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Coolify webhook
        run: |
          curl -sf "${{ secrets.COOLIFY_STAGING_WEBHOOK }}" \
            -o /dev/null -w "HTTP %{http_code}"
          echo ""
          echo "Coolify staging deploy triggered for ${{ github.sha }}"
